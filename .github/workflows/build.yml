name: Build

on:
  push:
    branches:
      - auto-jigsaw-exporter
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: auto_jigsaw_exporter-0.1.0
          path: build/libs/*.jar
