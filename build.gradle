            "curse.maven:goety-586095:7966952"
    )

    implementation fg.deobf(
            "curse.maven:goety-revelation-1236817:8026980"
    )

    implementation fg.deobf(
            "local:enigmaticdelicacy:${enigmatic_delicacy_version}"
    )

    implementation fg.deobf(
            "curse.maven:enigmatic-addons-1030121:6850589"
    )

    implementation fg.deobf(
            "curse.maven:enigmatic-legacy-336184:5600004"
    )

    implementation fg.deobf(
            "local:relics-1.20.1:0.8.0.13"
    )

    compileOnly fg.deobf(
            "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    )

    compileOnly fg.deobf(
            "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    )

    runtimeOnly fg.deobf(
            "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    )

    runtimeOnly fg.deobf(
            "local:aether:1.20.1-1.5.2-neoforge"
    )

    runtimeOnly fg.deobf(
            "local:aethersdelight:0.1.3.1-1.20.1"
    )

    runtimeOnly fg.deobf(
            "local:eeeabsmobs:1.20.1-0.97-Fix"
    )

    runtimeOnly fg.deobf(
            "local:irons_lib:1.20.1-1.0.2"
    )

    runtimeOnly fg.deobf(
            "local:irons_spellbooks:1.20.1-3.15.6"
    )

    runtimeOnly fg.deobf(
            "local:L_Enders_Cataclysm:3.27"
    )

    runtimeOnly fg.deobf(
            "local:legendarymonsters:2.1.22-MC-1.20.1"
    )

    runtimeOnly fg.deobf(
            "local:lionfishapi:2.7"
    )

    runtimeOnly fg.deobf(
            "local:obscure_api:18"
    )

    runtimeOnly fg.deobf(
            "local:player-animation-lib-forge:1.0.2-rc1+1.20"
    )

    runtimeOnly fg.deobf(
            "local:TerraCurio:0.2.0"
    )

    runtimeOnly fg.deobf(
            "local:ThirstWasTaken:1.20.1-1.4.0"
    )

    runtimeOnly fg.deobf(
            "local:Patchouli-1.20.1:85-FORGE"
    )

    runtimeOnly fg.deobf(
            "local:caelus-forge:3.2.0+1.20.1"
    )

    runtimeOnly fg.deobf(
            "local:EndingLibrary-1.20.1:2.1.15fix-all"
    )

    compileOnly(
            annotationProcessor(
                    "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
            )
    )
    implementation fg.deobf("local:l2library:2.5.3")
        implementation fg.deobf("local:l2tabs:0.3.3")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'eternal_career.refmap.json'
    config 'eternal_career.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'

    def replaceProperties = [
            minecraft_version             : minecraft_version,
            minecraft_version_range       : minecraft_version_range,
            forge_version                 : forge_version,
            forge_version_range           : forge_version_range,
            loader_version_range          : loader_version_range,
            until_eternity_version        : until_eternity_version,
            curios_version                : curios_version,
            geckolib_version              : geckolib_version,
            jei_version                   : jei_version,
            farmers_delight_mod_version   : farmers_delight_mod_version,
            solcarrot_version             : solcarrot_version,
            goety_version                 : goety_version,
            goety_revelation_version      : goety_revelation_version,
            enigmatic_delicacy_version    : enigmatic_delicacy_version,
            enigmatic_addons_version      : enigmatic_addons_version,
            enigmatic_legacy_version      : enigmatic_legacy_version,
            mod_id                        : mod_id,
            mod_name                      : mod_name,
            mod_license                   : mod_license,
            mod_version                   : mod_version,
            mod_authors                   : mod_authors,
            mod_description               : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching([
            'META-INF/mods.toml',
            'pack.mcmeta'
    ]) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    dependsOn 'addMixinsToJar'

    manifest {
        attributes([
                'Specification-Title'      : mod_id,
                'Specification-Vendor'     : mod_authors,
                'Specification-Version'    : '1',
                'Implementation-Title'     : project.name,
                'Implementation-Version'   : project.jar.archiveVersion,
                'Implementation-Vendor'    : mod_authors,
                'Implementation-Timestamp' :
                        new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'             :
                        'eternal_career.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

def productionRefmapName = 'eternal_career.refmap.json'
def productionMixinConfigName = 'eternal_career.mixins.json'
def expectedProductionJarName = "${mod_id}-${mod_version}.jar"

def annotationProcessorRefmap = layout.buildDirectory.file(
        'tmp/compileJava/compileJava-refmap.json'
)

def mixinGradleRefmap = layout.buildDirectory.file(
        "tmp/compileJava/${productionRefmapName}"
)

def productionJar = tasks.named('jar', Jar).flatMap {
    it.archiveFile
}

def expectedProductionMappings = [
        'com/carrot123/eternal_career/mixin/vanilla/AbstractContainerMenuRedemptionMixin': [
                'doClick':
                        'Lnet/minecraft/world/inventory/AbstractContainerMenu;m_150430_(IILnet/minecraft/world/inventory/ClickType;Lnet/minecraft/world/entity/player/Player;)V'
        ],
        'com/carrot123/eternal_career/mixin/compat/until_eternity/TrueChefsKnifeItemMixin': [
                'hurtEnemy(Lnet/minecraft/world/item/ItemStack;Lnet/minecraft/world/entity/LivingEntity;Lnet/minecraft/world/entity/LivingEntity;)Z':
                        'Lcom/carrot123/until_eternity/item/TrueChefsKnifeItem;m_7579_(Lnet/minecraft/world/item/ItemStack;Lnet/minecraft/world/entity/LivingEntity;Lnet/minecraft/world/entity/LivingEntity;)Z'
        ]
]

tasks.named('assemble').configure {
    dependsOn tasks.named('reobfJar')
}

def verifyProductionRefmap = tasks.register('verifyProductionRefmap') {
    group = 'verification'

    description =
            'Verifies the generated Mixin refmap and the single reobfuscated production JAR.'

    dependsOn tasks.named('reobfJar')

    inputs.file(productionJar)
    inputs.file(annotationProcessorRefmap)
    inputs.file(mixinGradleRefmap)

    doLast {
        def jarFile = productionJar.get().asFile

        if (!jarFile.isFile()) {
            throw new GradleException(
                    "Production JAR does not exist: ${jarFile}"
            )
        }

        if (jarFile.name != expectedProductionJarName) {
            throw new GradleException(
                    "Expected production JAR '${expectedProductionJarName}', found '${jarFile.name}'."
            )
        }

        def libsDirectory = layout.buildDirectory
                .dir('libs')
                .get()
                .asFile
                .canonicalFile

        if (jarFile.parentFile.canonicalFile != libsDirectory) {
            throw new GradleException(
                    "Production JAR is outside build/libs: ${jarFile.canonicalFile}"
            )
        }

        def distributableJars = fileTree(libsDirectory) {
            include '*.jar'
        }.files.collect {
            it.canonicalFile
        }.sort {
            it.name
        }

        if (distributableJars.size() != 1
                || distributableJars.first() != jarFile.canonicalFile) {
            throw new GradleException(
                    "build/libs must contain only '${expectedProductionJarName}', found: "
                            + distributableJars.collect { it.name }
            )
        }

        def apRefmapFile = annotationProcessorRefmap.get().asFile
        def namedRefmapFile = mixinGradleRefmap.get().asFile

        [
                'annotation processor refmap': apRefmapFile,
                'MixinGradle refmap'        : namedRefmapFile
        ].each { label, file ->
            if (!file.isFile() || file.length() == 0) {
                throw new GradleException(
                        "Missing or empty ${label}: ${file}"
                )
            }
        }

        def apRefmapBytes = apRefmapFile.bytes
        def namedRefmapBytes = namedRefmapFile.bytes

        if (!java.util.Arrays.equals(
                apRefmapBytes,
                namedRefmapBytes
        )) {
            throw new GradleException(
                    'MixinGradle refmap differs from annotation processor output.'
            )
        }

        if (file(
                "src/main/resources/${productionRefmapName}"
        ).exists()) {
            throw new GradleException(
                    "A static source refmap must not replace the generated ${productionRefmapName}."
            )
        }

        def zipFile = new java.util.jar.JarFile(jarFile)

        try {
            def refmapEntries =
                    java.util.Collections.list(
                            zipFile.entries()
                    ).findAll {
                        it.name == productionRefmapName
                    }

            if (refmapEntries.size() != 1) {
                throw new GradleException(
                        "Expected exactly one ${productionRefmapName} in ${jarFile.name}, "
                                + "found ${refmapEntries.size()}."
                )
            }

            def refmapEntry = refmapEntries.first()

            def jarRefmapBytes =
                    zipFile.getInputStream(
                            refmapEntry
                    ).withCloseable {
                        it.bytes
                    }

            if (jarRefmapBytes.length == 0) {
                throw new GradleException(
                        "${productionRefmapName} is empty in ${jarFile.name}."
                )
            }

            if (!java.util.Arrays.equals(
                    namedRefmapBytes,
                    jarRefmapBytes
            )) {
                throw new GradleException(
                        'Production JAR refmap differs from generated MixinGradle refmap.'
                )
            }

            def refmap =
                    new groovy.json.JsonSlurper().parseText(
                            new String(
                                    jarRefmapBytes,
                                    java.nio.charset.StandardCharsets.UTF_8
                            )
                    )

            def mappings = refmap.mappings
            def seargeMappings = refmap.data?.searge

            if (!(mappings instanceof Map)
                    || mappings != seargeMappings) {
                throw new GradleException(
                        "${productionRefmapName} mappings and data.searge are missing or different."
                )
            }

            expectedProductionMappings.each {
                mixinName,
                expectedMethods ->

                expectedMethods.each {
                    sourceMethod,
                    expectedTarget ->

                    def actualTarget =
                            mappings
                                    ?.get(mixinName)
                                    ?.get(sourceMethod)

                    if (actualTarget != expectedTarget) {
                        throw new GradleException(
                                "Incorrect production mapping for ${mixinName}.${sourceMethod}. "
                                        + "Expected '${expectedTarget}', found '${actualTarget}'."
                        )
                    }
                }
            }

            def mixinConfigEntry =
                    zipFile.getJarEntry(
                            productionMixinConfigName
                    )

            if (mixinConfigEntry == null
                    || mixinConfigEntry.size == 0) {
                throw new GradleException(
                        "Missing or empty ${productionMixinConfigName} in ${jarFile.name}."
                )
            }

            def mixinConfig =
                    zipFile.getInputStream(
                            mixinConfigEntry
                    ).withCloseable {
                        stream ->
                            new groovy.json.JsonSlurper().parse(
                                    stream,
                                    'UTF-8'
                            )
                    }

            if (mixinConfig.refmap != productionRefmapName) {
                throw new GradleException(
                        "${productionMixinConfigName} must reference '${productionRefmapName}', "
                                + "found '${mixinConfig.refmap}'."
                )
            }

            def mixinPackagePath =
                    mixinConfig.package.replace(
                            '.',
                            '/'
                    )

            def declaredMixins = []

            declaredMixins.addAll(
                    mixinConfig.mixins ?: []
            )

            declaredMixins.addAll(
                    mixinConfig.client ?: []
            )

            declaredMixins.each {
                mixinClass ->

                    def classEntryName =
                            "${mixinPackagePath}/${mixinClass.replace('.', '/')}.class"

                    if (zipFile.getJarEntry(
                            classEntryName
                    ) == null) {
                        throw new GradleException(
                                "Declared Mixin class is missing from ${jarFile.name}: ${classEntryName}"
                        )
                    }
            }

            def breakStanceClass =
                    'com/carrot123/eternal_career/mixin/vanilla/LivingEntityBreakStanceMixin.class'

            if (zipFile.getJarEntry(
                    breakStanceClass
            ) == null) {
                throw new GradleException(
                        "LivingEntityBreakStanceMixin.class is missing from ${jarFile.name}."
                )
            }

            def manifestMixinConfigs =
                    zipFile
                            .manifest
                            ?.mainAttributes
                            ?.getValue('MixinConfigs')

            if (manifestMixinConfigs
                    != productionMixinConfigName) {
                throw new GradleException(
                        "MANIFEST.MF MixinConfigs must be '${productionMixinConfigName}', "
                                + "found '${manifestMixinConfigs}'."
                )
            }

            def refmapSha256 =
                    java.security.MessageDigest
                            .getInstance('SHA-256')
                            .digest(jarRefmapBytes)
                            .encodeHex()
                            .toString()

            logger.lifecycle(
                    "Verified {} in {}: {} declared Mixins, {} production mappings, SHA-256 {}",
                    productionRefmapName,
                    jarFile.name,
                    declaredMixins.size(),
                    expectedProductionMappings.size(),
                    refmapSha256
            )
        } finally {
            zipFile.close()
        }
    }
}

tasks.named('build').configure {
    dependsOn verifyProductionRefmap
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('check').configure {
    dependsOn tasks.named('soulGameTestClasses')
}