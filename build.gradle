plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    soulGameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    file("${buildDir}/createSrgToMcp/output.srg").absolutePath

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('run-soul-tests')
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'forge.gameTestServer.report',
                    file('build/reports/soul-gametest.xml').absolutePath

            mods {
                "${mod_id}" {
                    source sourceSets.soulGameTest
                }
            }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod',
                    mod_id,
                    '--all',
                    '--output',
                    file('src/generated/resources/'),
                    '--existing',
                    file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()

    maven {
        name = 'Illusive Soulworks'
        url = 'https://maven.theillusivec4.top/'
    }

    maven {
        name = 'Puffish'
        url = 'https://maven.puffish.net'
    }

    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }

    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    flatDir {
        dirs '../UntilEternity-1.20.1-Forge/build/libs'
        dirs 'libs'
        dirs 'run/dev-libs'
        dirs dev_pack_mods_dir
    }
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf(
            "local:until_eternity:${until_eternity_version}"
    )

    implementation fg.deobf(
            "top.theillusivec4.curios:curios-forge:${curios_version}"
    )

    implementation fg.deobf(
            "net.puffish:attributesmod:${puffish_attributes_version}:forge"
    )

    implementation fg.deobf(
            "curse.maven:geckolib-388172:${geckolib_curse_file}"
    )

    implementation fg.deobf(
            "local:FarmersDelight-${minecraft_version}:${farmers_delight_version}"
    )

    implementation fg.deobf(
            "local:solcarrot-${minecraft_version}:${solcarrot_version}"
    )

